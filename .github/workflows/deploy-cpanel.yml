name: Deploy to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpanel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
          SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
          CPANEL_APP_PATH: ${{ secrets.CPANEL_APP_PATH }}
        run: |
          set -eu

          for name in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_KNOWN_HOSTS CPANEL_APP_PATH; do
            if [ -z "$(printenv "$name")" ]; then
              echo "::error::Missing GitHub Actions secret for $name"
              exit 1
            fi
          done

          case "$CPANEL_APP_PATH" in
            /*) ;;
            *)
              echo "::error::CPANEL_APP_PATH must be an absolute Linux path"
              exit 1
              ;;
          esac

          if ! printf '%s' "$CPANEL_APP_PATH" | grep -Eq '^/[A-Za-z0-9._/-]+$'; then
            echo "::error::CPANEL_APP_PATH may only contain letters, numbers, dots, underscores, slashes, and hyphens"
            exit 1
          fi

          SSH_PORT="${SSH_PORT:-22}"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/cpanel_deploy"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/cpanel_deploy" "$HOME/.ssh/known_hosts"

          ssh -i "$HOME/.ssh/cpanel_deploy" \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$SSH_USER@$SSH_HOST" "bash -s -- '$CPANEL_APP_PATH'" <<'REMOTE'
          set -eu
          APP_PATH=$1
          cd "$APP_PATH"

          if [ ! -d .git ]; then
            echo "The cPanel application directory must be a Git clone of this repository."
            exit 1
          fi

          REMOTE_URL=$(git remote get-url origin)
          case "$REMOTE_URL" in
            https://github.com/Uzair-Said/Portfolio.git|git@github.com:Uzair-Said/Portfolio.git) ;;
            *)
              echo "The application directory origin is not Uzair-Said/Portfolio."
              exit 1
              ;;
          esac

          git fetch origin main
          git pull --ff-only origin main
          npm ci
          npm run build
          mkdir -p tmp
          touch tmp/restart.txt
          echo "Deployment complete."
          REMOTE

          rm -f "$HOME/.ssh/cpanel_deploy"
